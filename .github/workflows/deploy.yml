name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: FRONTEND/package-lock.json

      - name: Install dependencies
        working-directory: FRONTEND
        run: npm ci

      - name: Build
        working-directory: FRONTEND
        env:
          VITE_FIREBASE_API_KEY: AIzaSyAVxE0qJEV2hPdCkOdjyBV0_Jpfv7wve-Q
          VITE_FIREBASE_AUTH_DOMAIN: trainmanager-6f395.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: trainmanager-6f395
          VITE_FIREBASE_STORAGE_BUCKET: trainmanager-6f395.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "18953441315"
          VITE_FIREBASE_APP_ID: G-H7Y9E4G31H
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: trainmanager-6f395
